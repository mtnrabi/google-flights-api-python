# Publishes to PyPI when a tag like v0.1.0 is pushed, with PyPI trusted
# publishing (OIDC): no token is stored anywhere. Needs a trusted publisher on
# pypi.org for this repo, workflow `publish.yml`, environment `pypi`.
name: publish

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag must match the package version
        run: |
          v=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('src/flightpowers/client.py').read()).group(1))")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version $v"; exit 1; }
      - run: pip install -e '.[test]' build
      - run: pytest -q
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/flightpowers/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
